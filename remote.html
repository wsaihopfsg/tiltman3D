<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Voice Remote</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow: hidden; /* Prevents whole-page scrolling, delegates to tabs */
        }

        /* Two-panel slider setup */
        #slider {
            display: flex;
            width: 200vw;
            /* Default to showing the Main page on the right */
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            height: 100vh;
        }

        .page {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Page Layouts */
        #page-controls { background: #1e293b; align-items: center; }
        #page-main { background: #0f172a; align-items: center; }

        h2 { margin-top: 0; }
        .swipe-hint {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
            font-style: italic;
            text-align: center;
        }

        button {
            width: 100%;
            max-width: 340px;
            padding: 16px;
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            flex-shrink: 0;
        }
        
        button.manual { background: #334155; text-align: left; }
        button.clear { background: #991b1b; }
        
        #status { margin: 14px 0; font-size: 14px; color: #94a3b8; flex-shrink: 0; }
        
        #heard {
            width: 100%;
            max-width: 340px;
            min-height: 44px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #38bdf8;
            box-sizing: border-box;
            flex-shrink: 0;
            margin-bottom: 16px;
        }

        /* Teleprompter Script Area */
        #script-container {
            width: 100%;
            max-width: 340px;
            flex-grow: 1;
            background: #000;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        .highlight {
            background-color: #fbbf24;
            color: #000;
            border-radius: 3px;
            padding: 0 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="slider">
        <!-- LEFT TAB: Slide Transition Buttons -->
        <div id="page-controls" class="page">
            <div class="swipe-hint">&larr; Swipe Left to return to Main screen</div>
            <h2>Slide Controls</h2>
            
            <button class="manual" onclick="sendAction('name')">1. Morph Name (世浩 → 細號)</button>
            <button class="manual" onclick="sendAction('aussie')">2. Aussie Soldier Comic</button>
            <button class="manual" onclick="sendAction('wave-static')">3. SAF Video (Static Frame 0)</button>
            <button class="manual" onclick="sendAction('wave-play')">4. SAF Video (Play Wave)</button>
            <button class="manual clear" onclick="sendAction('clear')">Clear Screen</button>
        </div>

        <!-- RIGHT TAB: Main Transcript & Teleprompter -->
        <div id="page-main" class="page">
            <div class="swipe-hint">Swipe Right &rarr; for Slide Controls</div>
            <button id="connect-btn">Connect & Start Mic</button>
            <div id="status">Tap Connect when laptop is ready</div>
            
            <div id="heard">Mic transcript will appear here...</div>
            
            <div id="script-container">Loading speech.txt...</div>
        </div>
    </div>

    <script>
        // --- UI Swipe Logic ---
        const slider = document.getElementById('slider');
        let touchstartX = 0;
        let touchendX = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const threshold = 50; // minimum pixel distance to count as a swipe
            if (touchendX - touchstartX > threshold) {
                // Swipe Right (finger moves left-to-right) -> Show Controls (Left Tab)
                slider.style.transform = 'translateX(0)';
            }
            if (touchstartX - touchendX > threshold) {
                // Swipe Left (finger moves right-to-left) -> Show Main (Right Tab)
                slider.style.transform = 'translateX(-100vw)';
            }
        }

        // --- Load Script from speech.txt ---
        let rawScript = "";
        const scriptEl = document.getElementById('script-container');
        
        fetch('speech.txt')
            .then(response => {
                if (!response.ok) throw new Error("File not found");
                return response.text();
            })
            .then(text => {
                rawScript = text;
                scriptEl.innerHTML = text;
            })
            .catch(err => {
                scriptEl.innerHTML = "Could not load speech.txt. Make sure the file exists in the same folder.";
            });

        // --- PeerJS Connection ---
        let conn = null;
        let isCooldown = false;
        let isListening = false;

        const peer = new Peer();
        const statusEl = document.getElementById('status');
        const heardEl = document.getElementById('heard');
        const FIXED_PEER_ID = 'wsaihopfsg-shortness-talk-2026';

        peer.on('error', (err) => {
            statusEl.textContent = `Peer Error: ${err.type}`;
            statusEl.style.color = '#f87171';
            console.error('PeerJS error:', err);
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            statusEl.textContent = 'Connecting to laptop...';
            conn = peer.connect(FIXED_PEER_ID);

            conn.on('open', () => {
                statusEl.textContent = 'Connected & Listening!';
                statusEl.style.color = '#4ade80';
                isListening = true;
                recognition.start();
            });
        });

        function sendAction(action) {
            if (conn && conn.open) {
                conn.send({ action });
            }
        }

        function triggerCooldown() {
            isCooldown = true;
            setTimeout(() => { isCooldown = false; }, 2000);
        }

        // --- Live Highlighter ---
        function updateTeleprompterHighlight(transcriptText) {
            if (!rawScript || transcriptText.length < 4) return;
            
            // Get the last 3 or 4 words spoken to track the current position
            const words = transcriptText.trim().split(/\s+/);
            const searchPhrase = words.slice(-4).join(' ');
            if (searchPhrase.length < 4) return;

            // Create a regex that ignores punctuation and line breaks between words
            const escapedWords = searchPhrase.split(' ').map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regexStr = escapedWords.join('[\\s\\W]+');
            
            try {
                const regex = new RegExp(`(${regexStr})`, 'gi');
                const highlightedHtml = rawScript.replace(regex, '<span class="highlight">$1</span>');
                scriptEl.innerHTML = highlightedHtml;
                
                // Auto-scroll the script window to the highlighted word
                const mark = scriptEl.querySelector('.highlight');
                if (mark) {
                    mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (err) {
                // Ignore regex generation errors from partial/weird speech
            }
        }

        // --- Speech Recognition ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-SG';

        recognition.onresult = (event) => {
            let fullTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                fullTranscript += event.results[i][0].transcript;
            }
            
            const transcriptClean = fullTranscript.toLowerCase().trim();
            heardEl.textContent = `"${transcriptClean}"`;

            // Update the script highlight based on the current speech
            updateTeleprompterHighlight(transcriptClean);

            if (isCooldown) return;

            // Slide Triggers
            if (transcriptClean.includes('cantonese') || transcriptClean.includes('kantonese') || transcriptClean.includes('small size')) {
                sendAction('name');
                triggerCooldown();
            } else if (transcriptClean.includes('brunei') || transcriptClean.includes('aussie')) {
                sendAction('aussie');
                triggerCooldown();
            } else if (transcriptClean.includes('taiwan') || transcriptClean.includes('saf') || transcriptClean.includes('uniform')) {
                sendAction('wave-static');
                triggerCooldown();
            } else if (transcriptClean.includes('wave your hand')) {
                sendAction('wave-play');
                triggerCooldown();
            } else if (transcriptClean.includes('clear screen') || transcriptClean.includes('hide visual')) {
                sendAction('clear');
                triggerCooldown();
            }
        };

        recognition.onend = () => {
            if (isListening) {
                try { recognition.start(); } catch (e) {}
            }
        };
    </script>
</body>
</html>
